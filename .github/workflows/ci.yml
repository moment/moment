name: CI

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - lts/-2
          - lts/-1
          - lts/*
          - latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        if: matrix.node-version != 'lts/*'
        run: |
          npm install
          grunt

      - name: Build with coverage
        if: matrix.node-version == 'lts/*'
        run: |
          npm install
          npx grunt lint
          npm run coverage

      - name: Report coverage to Coveralls
        if: matrix.node-version == 'lts/*'
        run: |
          curl -fsSL https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-linux-x86_64.tar.gz | tar -xz
          ./coveralls report coverage/lcov.info
        env:
          COVERALLS_REPO_TOKEN: ${{ github.token }}
