name: FOSSA

on:
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-scan:
    name: License scan
    runs-on: ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | sudo bash

      - name: Analyze dependencies and project licenses
        run: fossa analyze --experimental-force-first-party-scans

      - name: Test license policy
        run: fossa test
